version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - revive
    - sloglint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # reorders struct fields for size; not worth the churn
    gosec:
      excludes:
        - G404 # math/rand only shuffles queue polling order; nothing here needs crypto/rand
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      key-naming-case: snake
      static-msg: true

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
